apply plugin: "java-library"
apply plugin: "me.champeau.jmh"

dependencies {
    api("org.redlance.common-utils:services:$rootProject.commonutils_version") { transitive = false }
    api("com.zigythebird:mochafloats:$rootProject.molang_version") { transitive = false }
    compileOnlyApi("org.jetbrains:annotations:26.1.0")

    // Minecraft libs
    api("com.google.code.gson:gson:2.14.0")
    api("org.slf4j:slf4j-api:2.0.18")
    api("it.unimi.dsi:fastutil:8.5.19")
    api("io.netty:netty-buffer:4.2.17.Final")
    api("org.joml:joml:1.10.9")

    // Testing
    testImplementation(platform("org.junit:junit-bom:6.1.3"))
    testImplementation("org.junit.jupiter:junit-jupiter-api")
    testImplementation("org.junit.jupiter:junit-jupiter-params")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
    testImplementation("dev.kosmx.player-anim:anim-core:2.0.3.2+1.21.5")
    testImplementation("org.redlance.common-utils:reflect:$rootProject.commonutils_version") { transitive = false }
}

sourceSets {
    test {
        resources {
            srcDir("../minecraft/src/main/resources")
        }
    }

    // The benchmarks measure the library against its own shipped animations
    jmh {
        resources {
            srcDir("../minecraft/src/main/resources")
        }
    }
}

jmh {
    jmhVersion = "1.37"
    includeTests = false

    // Otherwise a benchmark that throws is dropped from the results and the run still succeeds,
    // leaving a report that silently compares fewer benchmarks than it ran.
    failOnError = true

    // Kept here rather than in @Fork/@Warmup/@Measurement so a CI run and a local run are configured
    // in exactly one place. Two forks rather than one: a single JVM bakes in whichever compilation
    // plan it happened to pick. Measured on this suite, the second fork pulls the error bars from a
    // ~8% median down to ~2%, which is what makes a 5% regression distinguishable from noise at all.
    // It also doubles the run to about five minutes, and the benchmark workflow runs it twice.
    fork = 2
    warmupIterations = 5
    warmup = "1s"
    iterations = 5
    timeOnIteration = "1s"

    resultFormat = "JSON"
    resultsFile = layout.buildDirectory.file("results/jmh/results.json")
}

jar {
    manifest.attributes(
            "FMLModType": "GAMELIBRARY",
            "Automatic-Module-Name": "PlayerAnimationLibCore"
    )
}

tasks.test {
    useJUnitPlatform()
    maxHeapSize = "4G"
}

// The benchmarks call library API but nothing else builds them, so an ordinary `build` would let a
// rename break them and only surface it on the next pull request's benchmark run.
tasks.check {
    dependsOn(tasks.jmhClasses)
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = "PlayerAnimationLibCore"
            from components.java
        }
    }
}
